<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#6c5ce7">
<meta name="description" content="Smart Kids World - عالم الأطفال الذكي">
<link rel="manifest" href="manifest.json">

<title>🌈 Smart Kids World</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#eef2ff,#fff7ed);
  color:#222;
  min-height:100vh;
}

button{
  font-family:inherit;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:12px;
}

header{
  background:linear-gradient(135deg,#6c5ce7,#0984e3);
  color:white;
  border-radius:24px;
  padding:18px;
  box-shadow:0 8px 25px rgba(0,0,0,.15);
  margin-bottom:15px;
}

.logo{
  font-size:28px;
  font-weight:bold;
  text-align:center;
  margin-bottom:15px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.stat{
  background:rgba(255,255,255,.18);
  border-radius:15px;
  padding:10px 5px;
  text-align:center;
}

.stat b{
  display:block;
  font-size:20px;
}

.stat span{
  font-size:12px;
}

.progress-wrap{
  margin-top:12px;
  background:rgba(255,255,255,.2);
  border-radius:20px;
  overflow:hidden;
  height:12px;
}

.progress{
  height:100%;
  width:0%;
  background:white;
  transition:.4s;
}

.screen{
  display:none;
}

.screen.active{
  display:block;
}

.card{
  background:white;
  border-radius:25px;
  padding:20px;
  margin-bottom:15px;
  box-shadow:0 7px 25px rgba(0,0,0,.08);
}

.welcome{
  text-align:center;
  padding:25px 15px;
}

.welcome .emoji{
  font-size:70px;
}

.welcome h1{
  color:#6c5ce7;
}

.menu{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.menu button{
  border:0;
  border-radius:22px;
  padding:22px 10px;
  color:white;
  font-size:18px;
  font-weight:bold;
  box-shadow:0 5px 15px rgba(0,0,0,.12);
  transition:.15s;
}

.menu button:active{
  transform:scale(.96);
}

.math{background:#ff7675}
.words{background:#00b894}
.colors{background:#fdcb6e;color:#333!important}
.animals{background:#0984e3}
.achievements{background:#a55eea}
.settings{background:#636e72}

.question{
  text-align:center;
  font-size:30px;
  font-weight:bold;
  margin:20px 0;
}

.question.small{
  font-size:23px;
}

.question-icon{
  font-size:75px;
  text-align:center;
  margin:10px;
}

.options{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.option{
  border:3px solid #e5e7eb;
  background:#fff;
  border-radius:20px;
  padding:18px 10px;
  font-size:24px;
  font-weight:bold;
  min-height:70px;
  transition:.15s;
}

.option:active{
  transform:scale(.96);
}

.option.correct{
  background:#55efc4;
  border-color:#00b894;
}

.option.wrong{
  background:#ff7675;
  border-color:#d63031;
  color:white;
}

.feedback{
  text-align:center;
  font-size:22px;
  font-weight:bold;
  min-height:35px;
  margin:15px 0;
}

.controls{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
  margin-top:15px;
}

.control-btn{
  border:0;
  border-radius:15px;
  padding:12px 18px;
  background:#6c5ce7;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.back{
  background:#636e72;
}

.next{
  background:#00b894;
}

.reset{
  background:#d63031;
}

.language-buttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.language-buttons button{
  border:2px solid #ddd;
  background:white;
  border-radius:15px;
  padding:12px 5px;
  font-weight:bold;
}

.language-buttons button.selected{
  background:#6c5ce7;
  color:white;
  border-color:#6c5ce7;
}

.achievement{
  display:flex;
  align-items:center;
  gap:15px;
  padding:15px;
  border-radius:18px;
  background:#f8f9fa;
  margin-bottom:10px;
}

.achievement.locked{
  opacity:.45;
}

.achievement-icon{
  font-size:40px;
}

.achievement h3{
  margin:0 0 5px;
}

.achievement p{
  margin:0;
  color:#666;
}

.level-badge{
  display:inline-block;
  background:#ffeaa7;
  color:#6c5ce7;
  border-radius:20px;
  padding:7px 15px;
  font-weight:bold;
}

.mode{
  text-align:center;
  color:#777;
  font-size:14px;
}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%) translateY(100px);
  background:#222;
  color:white;
  padding:14px 22px;
  border-radius:20px;
  z-index:9999;
  transition:.3s;
  opacity:0;
}

.toast.show{
  transform:translateX(-50%) translateY(0);
  opacity:1;
}

.confetti{
  position:fixed;
  top:-20px;
  font-size:25px;
  z-index:9998;
  animation:fall 2s linear forwards;
  pointer-events:none;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(720deg);
    opacity:0;
  }
}

.color-box{
  width:120px;
  height:120px;
  margin:20px auto;
  border-radius:25px;
  box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.shape-box{
  width:130px;
  height:130px;
  margin:20px auto;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:100px;
}

@media(max-width:500px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .menu{
    grid-template-columns:1fr 1fr;
  }

  .question{
    font-size:25px;
  }

  .option{
    font-size:20px;
    padding:15px 8px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">🌈 Smart Kids World</div>

  <div class="stats">
    <div class="stat">
      ⭐ <b id="stars">0</b>
      <span id="starsLabel">Stars</span>
    </div>

    <div class="stat">
      ⚡ <b id="xp">0</b>
      <span>XP</span>
    </div>

    <div class="stat">
      🔥 <b id="streak">0</b>
      <span id="streakLabel">Streak</span>
    </div>

    <div class="stat">
      🏆 <b id="level">1</b>
      <span id="levelLabel">Level</span>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress" id="progress"></div>
  </div>
</header>

<!-- HOME -->
<section id="home" class="screen active">

  <div class="card welcome">
    <div class="emoji">🌈🧒🎓</div>
    <h1 id="welcomeTitle">مرحباً بك في عالم الأطفال الذكي!</h1>
    <p id="welcomeText">
      تعلّم والعب واكسب النجوم واصعد في المستويات!
    </p>

    <div class="level-badge">
      <span id="homeLevelText">المستوى</span>
      <span id="homeLevel">1</span>
    </div>
  </div>

  <div class="menu">

    <button class="math" onclick="startGame('math')">
      ➕<br>
      <span id="mathMenu">الرياضيات</span>
    </button>

    <button class="words" onclick="startGame('words')">
      🔤<br>
      <span id="wordsMenu">الحروف والكلمات</span>
    </button>

    <button class="colors" onclick="startGame('colors')">
      🎨<br>
      <span id="colorsMenu">الألوان والأشكال</span>
    </button>

    <button class="animals" onclick="startGame('animals')">
      🐶<br>
      <span id="animalsMenu">الحيوانات</span>
    </button>

    <button class="achievements" onclick="showAchievements()">
      🏆<br>
      <span id="achievementsMenu">الإنجازات</span>
    </button>

    <button class="settings" onclick="showSettings()">
      ⚙️<br>
      <span id="settingsMenu">الإعدادات</span>
    </button>

  </div>
</section>

<!-- GAME -->
<section id="game" class="screen">

  <div class="card">

    <div class="mode" id="gameMode"></div>

    <div class="question" id="question">
      ...
    </div>

    <div id="questionVisual"></div>

    <div class="options" id="options"></div>

    <div class="feedback" id="feedback"></div>

    <div class="controls">
      <button class="control-btn next" id="nextBtn" onclick="nextQuestion()" style="display:none">
        ➡️ التالي
      </button>

      <button class="control-btn back" onclick="goHome()">
        🏠 الرئيسية
      </button>
    </div>

  </div>
</section>

<!-- ACHIEVEMENTS -->
<section id="achievementScreen" class="screen">

  <div class="card">
    <h2 style="text-align:center">🏆 <span id="achievementTitle">الإنجازات</span></h2>
    <div id="achievementList"></div>

    <div class="controls">
      <button class="control-btn back" onclick="goHome()">🏠 الرئيسية</button>
    </div>
  </div>

</section>

<!-- SETTINGS -->
<section id="settingsScreen" class="screen">

  <div class="card">

    <h2 style="text-align:center">⚙️ <span id="settingsTitle">الإعدادات</span></h2>

    <h3 id="languageTitle">🌍 اللغة</h3>

    <div class="language-buttons">

      <button onclick="setLanguage('ar')" id="lang-ar">العربية</button>
      <button onclick="setLanguage('en')" id="lang-en">English</button>
      <button onclick="setLanguage('tr')" id="lang-tr">Türkçe</button>
      <button onclick="setLanguage('fr')" id="lang-fr">Français</button>
      <button onclick="setLanguage('es')" id="lang-es">Español</button>
      <button onclick="setLanguage('de')" id="lang-de">Deutsch</button>

    </div>

    <h3 id="soundTitle">🔊 الصوت</h3>

    <div class="controls">
      <button class="control-btn" onclick="toggleSound()" id="soundBtn">
        🔊 ON
      </button>
    </div>

    <hr>

    <div class="controls">
      <button class="control-btn reset" onclick="resetProgress()">
        🗑️ <span id="resetText">إعادة التقدم</span>
      </button>

      <button class="control-btn back" onclick="goHome()">
        🏠 <span id="homeText">الرئيسية</span>
      </button>
    </div>

  </div>
</section>

</div>

<div class="toast" id="toast"></div>

function randomInt(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

function shuffle(arr){
  return [...arr].sort(()=>Math.random()-0.5);
}

function t(key){
  return T[state.language][key] || T.en[key] || key;
}

/* ---------- AUDIO ---------- */

let audioContext = null;

function initAudio(){
  try{
    if(!audioContext){
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }

    if(audioContext.state === "suspended"){
      audioContext.resume();
    }
  }catch(e){}
}

function beep(type){

  if(!state.sound) return;

  try{

    initAudio();

    if(!audioContext) return;

    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();

    osc.connect(gain);
    gain.connect(audioContext.destination);

    let frequency = 500;

    if(type === "correct") frequency = 700;
    if(type === "wrong") frequency = 180;
    if(type === "level") frequency = 900;
    if(type === "click") frequency = 400;

    osc.frequency.value = frequency;
    osc.type = "sine";

    gain.gain.setValueAtTime(.001,audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(.2,audioContext.currentTime+.02);
    gain.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+.25);

    osc.start();
    osc.stop(audioContext.currentTime+.25);

  }catch(e){}
}

function speak(text){

  if(!state.sound) return;

  try{

    if(!("speechSynthesis" in window)) return;

    speechSynthesis.cancel();

    const voice = new SpeechSynthesisUtterance(text);

    const langs={
      ar:"ar-SA",
      en:"en-US",
      tr:"tr-TR",
      fr:"fr-FR",
      es:"es-ES",
      de:"de-DE"
    };

    voice.lang=langs[state.language] || "en-US";
    voice.rate=.85;
    voice.pitch=1.1;

    speechSynthesis.speak(voice);

  }catch(e){}
}

function generateQuestion(){

  document.getElementById("nextBtn").style.display="none";

  const level=getLevel();

  if(currentGame==="math"){
    currentQuestion=makeMathQuestion(level);
  }

  if(currentGame==="words"){

  }

  if(currentGame==="colors"){
    currentQuestion=makeColorQuestion(level);
  }

  if(currentGame==="animals"){
    currentQuestion=makeAnimalQuestion(level);
  }

  renderQuestion();

}

/* =====================================================
   MATH
===================================================== */

function makeMathQuestion(level){

  let a,b,answer,text,mode;

  if(level<=3){

    mode="addition";

    a=randomInt(1,10+level*5);
    b=randomInt(1,10+level*5);

    answer=a+b;
    text=`${a} + ${b} = ?`;

  }else if(level<=6){

    mode="subtraction";

    a=randomInt(5,20+level*5);
    b=randomInt(1,a);

    answer=a-b;
    text=`${a} − ${b} = ?`;

  }else if(level<=9){

    mode="multiplication";

    a=randomInt(2,5+Math.floor(level/2));
    b=randomInt(2,5+Math.floor(level/2));

    answer=a*b;
    text=`${a} × ${b} = ?`;

  }else if(level<=13){

    mode="division";

    b=randomInt(2,10);
    answer=randomInt(2,10);
    a=b*answer;

    text=`${a} ÷ ${b} = ?`;

  }else if(level<=17){

    mode="missing";

    const x=randomInt(1,20+level);

    const add=randomInt(1,15);

    answer=x;

    text=`? + ${add} = ${x+add}`;

  }else if(level<=22){

    mode="compare";

    a=randomInt(10,100);
    b=randomInt(10,100);

    answer=a>b ? a : b;

    text=`${a} و ${b}<br><small>اختر العدد الأكبر</small>`;

  }else{

    mode="mixed";

    const type=randomInt(1,4);

    if(type===1){

      a=randomInt(20,100);
      b=randomInt(10,50);
      answer=a+b;
      text=`${a} + ${b} = ?`;

    }else if(type===2){

      a=randomInt(30,150);
      b=randomInt(10,a);
      answer=a-b;
      text=`${a} − ${b} = ?`;

    }else if(type===3){

      a=randomInt(3,12);
      b=randomInt(3,12);
      answer=a*b;
      text=`${a} × ${b} = ?`;

    }else{

      b=randomInt(2,12);
      answer=randomInt(3,15);
      a=b*answer;

      text=`${a} ÷ ${b} = ?`;

    }

  }

  let options=[];

  if(mode==="compare"){

    options=[a,b];

    while(options.length<4){
      const n=randomInt(Math.max(1,Math.min(a,b)-20),Math.max(a,b)+20);
      if(!options.includes(n)) options.push(n);
    }

  }else{

    options=[answer];

    while(options.length<4){

      const delta=randomInt(1,Math.max(3,Math.floor(Math.abs(answer)*.35)+3));

      const n=Math.random()<.5
        ? answer+delta
        : Math.max(0,answer-delta);

      if(!options.includes(n)){
        options.push(n);
      }

    }

  }

  return {
    text,
    answer,
    options:shuffle(options),
    speech:String(answer)
  };

}

/* =====================================================
   WORDS
===================================================== */

function makeWordQuestion(level){

  const data=DATA[state.language] || DATA.en;

  const item=data.words[randomInt(0,data.words.length-1)];

  const word=item[0];
  const answer=item[1];

  let options=[answer];

  while(options.length<4){

    const letter=data.letters[randomInt(0,data.letters.length-1)];

    if(!options.includes(letter)){
      options.push(letter);
    }

  }

  return {
    text:`${t("which")}<br><br><strong style="font-size:38px">${word}</strong><br><small>ما هو الحرف الأول؟</small>`,
    answer,
    options:shuffle(options),
    speech:word
  };

}

   COLORS
===================================================== */

function makeColorQuestion(level){

  const data=DATA[state.language] || DATA.en;

  const item=data.colors[randomInt(0,data.colors.length-1)];

  let options=[item[0]];

  while(options.length<4){

    const other=data.colors[randomInt(0,data.colors.length-1)];

    if(!options.includes(other[0])){
      options.push(other[0]);
    }

  }

  return {
    text:t("choose"),
    answer:item[0],
    options:shuffle(options),
    visual:{
      type:"color",
      color:item[1],
      emoji:item[2]
    },
    speech:item[0]
  };

}

===================================================== */

function renderQuestion(){

  const level=getLevel();

  document.getElementById("level").textContent=level;

  let modeText=t("mathMode");

  if(currentGame==="words") modeText=t("wordMode");
  if(currentGame==="colors") modeText=t("colorMode");
  if(currentGame==="animals") modeText=t("animalMode");

  document.getElementById("gameMode").textContent=
    modeText+" • "+t("level")+" "+level;

  document.getElementById("question").innerHTML=
    currentQuestion.text;

  const visual=document.getElementById("questionVisual");

  visual.innerHTML="";

  if(currentQuestion.visual){

    if(currentQuestion.visual.type==="color"){

      visual.innerHTML=`
        <div class="question-icon">
          ${currentQuestion.visual.emoji}
        </div>
        <div class="color-box"
             style="background:${currentQuestion.visual.color}">
        </div>
      `;

    }

    if(currentQuestion.visual.type==="shape"){

      visual.innerHTML=`
        <div class="shape-box">
          ${currentQuestion.visual.shape}
        </div>
      `;

    }

    if(currentQuestion.visual.type==="animal"){

      visual.innerHTML=`
        <div class="question-icon">
          ${currentQuestion.visual.emoji}
        </div>
      `;

    }

  }

  const options=document.getElementById("options");

  options.innerHTML="";

  currentQuestion.options.forEach(option=>{

    const button=document.createElement("button");

    button.className="option";
    button.textContent=option;

    button.onclick=()=>checkAnswer(button,option);

    options.appendChild(button);

  });

  speak(currentQuestion.speech || currentQuestion.text);

}

/* =====================================================
   ANSWER
===================================================== */

function checkAnswer(button,answer){

  if(answered) return;

  answered=true;

  const oldLevel=getLevel();

  const all=document.querySelectorAll(".option");

  all.forEach(b=>{
    b.disabled=true;
  });

  if(String(answer)===String(currentQuestion.answer)){

    button.classList.add("correct");

    state.stars++;
    state.xp+=10;
    state.streak++;
    state.answered++;

    if(state.streak>=3){
      state.xp+=5;
    }

    beep("correct");

    document.getElementById("feedback").textContent=t("correct");

    createConfetti();

    checkAchievements();

    const newLevel=getLevel();

    if(newLevel>oldLevel){

      state.xp+=25;

      beep("level");

      setTimeout(()=>{
        showToast(t("levelup"));
      },300);

    }

    save();
    updateUI();

  }else{

    button.classList.add("wrong");

    state.streak=0;
    state.answered++;

    beep("wrong");

    document.getElementById("feedback").textContent=t("wrong");

    all.forEach(b=>{

      if(String(b.textContent)===String(currentQuestion.answer)){
        b.classList.add("correct");
      }

    });

    save();
    updateUI();

  }

  document.getElementById("nextBtn").style.display="inline-block";

}

    }

  });

  save();

}

function renderAchievements(){

  const list=document.getElementById("achievementList");

  list.innerHTML="";

  achievementData.forEach(item=>{

    const unlocked=state.stars>=item.stars;

    const div=document.createElement("div");

    div.className="achievement"+(unlocked?"":" locked");

    div.innerHTML=`
      <div class="achievement-icon">
        ${unlocked ? item.icon : "🔒"}
      </div>

      <div>
        <h3>${t(item.title)}</h3>
        <p>${t(item.desc)}</p>
      </div>
    `;

    list.appendChild(div);

  });

}

/* =====================================================
   RESET
===================================================== */

function resetProgress(){

  if(!confirm(t("resetConfirm"))) return;

  state={
    stars:0,
    xp:0,
    streak:0,
    answered:0,
    language:state.language,
    sound:state.sound,
    achievements:[]
  };

  save();
  updateUI();
  goHome();

  showToast(t("resetDone"));

}

/* =====================================================
   TOAST
===================================================== */

let toastTimer=null;

function showToast(message){

  const toast=document.getElementById("toast");

  toast.textContent=message;
  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer=setTimeout(()=>{
    toast.classList.remove("show");
  },2200);

}

/* =====================================================
   CONFETTI
===================================================== */

function createConfetti(){

  const symbols=["🎉","⭐","🌟","✨","🎊","💫"];

  for(let i=0;i<18;i++){

    const item=document.createElement("div");

    item.className="confetti";

    item.textContent=
      symbols[randomInt(0,symbols.length-1)];

    item.style.left=randomInt(0,100)+"%";

    item.style.animationDelay=
      Math.random()*.5+"s";

    document.body.appendChild(item);

    setTimeout(()=>{
      item.remove();
    },2500);

  }

}

/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener("keydown",e=>{

  if(!document.getElementById("game").classList.contains("active")){
    return;
  }

  if(e.key>="1" && e.key<="4"){

    const index=parseInt(e.key)-1;

    const buttons=document.querySelectorAll(".option");

    if(buttons[index]){
      buttons[index].click();
    }

  }

  if(e.key==="Enter" && answered){
    nextQuestion();
  }

});

/* =====================================================
   MOBILE AUDIO
===================================================== */

document.addEventListener("touchstart",()=>{
  initAudio();
},{once:true});

document.addEventListener("click",()=>{
  initAudio();
},{once:true});

/* =====================================================
   SERVICE WORKER
===================================================== */

if("serviceWorker" in navigator){

  window.addEventListener("load",()=>{

    navigator.serviceWorker
      .register("pwabuilder-sw.js")
      .catch(()=>{});

  });

}

/* =====================================================
   START
===================================================== */

updateUI();
checkAchievements();

</script>

</body>
